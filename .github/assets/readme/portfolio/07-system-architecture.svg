<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="1200" height="960" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title id="t">GlassPos Architecture</title>
<desc id="d">Architecture diagram: Cashier or Admin uses inbound HTTP adapters, which call application use cases. Core domain rules and ports sit inside the hexagon. Outbound adapters implement ports for MySQL persistence, read models, audit and transactional outbox, and PDF and Excel export, feeding owner-facing UI and reports.</desc>
