<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title id="t">Transaction Lifecycle</title>
<desc id="d">Transaction lifecycle: Draft, Created, Partial or Full Payment, Paid. Subsequent paths: revision or correction, cancellation, and refund, where cancellation and refund are different operations. Effects reach payment allocation, inventory movements, revision history, audit trail, and reporting and exports.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#111827"/></linearGradient>
<radialGradient id="glowA" cx="0.1" cy="0" r="0.7"><stop offset="0" stop-color="#2563EB" stop-opacity="0.28"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient>
<radialGradient id="glowB" cx="0.95" cy="1" r="0.6"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.22"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#06B6D4"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
<linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06B6D4"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
<filter id="blur8" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="blur14" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/></filter>
<marker id="ar0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/></marker>
<marker id="ar1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
<marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10B981"/></marker>
<marker id="ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B5CF6"/></marker>
<marker id="ar4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F59E0B"/></marker>
<marker id="ar5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker>

</defs>
<rect width="1200" height="900" rx="24" fill="url(#bg)"/>
<rect width="1200" height="900" rx="24" fill="url(#glowA)"/>
<rect width="1200" height="900" rx="24" fill="url(#glowB)"/>
<rect x="0.5" y="0.5" width="1199" height="899" rx="24" fill="none" stroke="#334155" stroke-opacity="0.8"/>
<rect x="56" y="36" width="5" height="52" rx="2.5" fill="url(#accentV)"/>
<text x="76" y="66" font-size="32" font-weight="700" fill="#F8FAFC">Transaction Lifecycle</text>
<text x="76" y="92" font-size="16" fill="#94A3B8">One transaction can affect money, stock, history, and reports</text>
<text x="60" y="138" font-size="12" font-weight="800" fill="#94A3B8" text-anchor="start" letter-spacing="2">MAIN FLOW</text>
<rect x="60" y="154" width="240" height="92" rx="18" fill="#94A3B8" fill-opacity="0.14" stroke="#94A3B8" stroke-opacity="0.85" filter="url(#drop)"/>
<rect x="60" y="154" width="240" height="5" rx="2.5" fill="#94A3B8"/>
<text x="180" y="196" font-size="22" font-weight="700" fill="#F8FAFC" text-anchor="middle" >Draft</text>
<text x="180" y="222" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle" >Not yet recorded</text>
<line x1="304" y1="200" x2="356" y2="200" stroke="#94A3B8" stroke-width="3" marker-end="url(#ar0)"/>
<rect x="340" y="154" width="240" height="92" rx="18" fill="#2563EB" fill-opacity="0.14" stroke="#2563EB" stroke-opacity="0.85" filter="url(#drop)"/>
<rect x="340" y="154" width="240" height="5" rx="2.5" fill="#2563EB"/>
<text x="460" y="196" font-size="22" font-weight="700" fill="#F8FAFC" text-anchor="middle" >Created</text>
<text x="460" y="222" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle" >Transaction recorded</text>
<line x1="584" y1="200" x2="636" y2="200" stroke="#2563EB" stroke-width="3" marker-end="url(#ar1)"/>
<rect x="620" y="154" width="240" height="92" rx="18" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-opacity="0.85" filter="url(#drop)"/>
<rect x="620" y="154" width="240" height="5" rx="2.5" fill="#10B981"/>
<text x="740" y="187" font-size="19" font-weight="700" fill="#F8FAFC" text-anchor="middle" >Partial / Full</text>
<text x="740" y="208" font-size="19" font-weight="700" fill="#F8FAFC" text-anchor="middle" >Payment</text>
<text x="740" y="231" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle" >Payment allocated</text>
<line x1="864" y1="200" x2="916" y2="200" stroke="#10B981" stroke-width="3" marker-end="url(#ar2)"/>
<rect x="900" y="154" width="240" height="92" rx="18" fill="#06B6D4" fill-opacity="0.14" stroke="#06B6D4" stroke-opacity="0.85" filter="url(#drop)"/>
<rect x="900" y="154" width="240" height="5" rx="2.5" fill="#06B6D4"/>
<text x="1020" y="196" font-size="22" font-weight="700" fill="#F8FAFC" text-anchor="middle" >Paid</text>
<text x="1020" y="222" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle" >Settled</text>
<text x="60" y="292" font-size="12" font-weight="800" fill="#94A3B8" text-anchor="start" letter-spacing="2">SUBSEQUENT PATHS MAY INCLUDE</text>
<path d="M1020 248 L1020 312 L230 312 M600 312 L600 340 M230 312 L230 340 M1020 312 L1020 340" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="6 5"/>
<line x1="230" y1="330" x2="230" y2="342" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#ar0)"/>
<line x1="600" y1="330" x2="600" y2="342" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#ar0)"/>
<line x1="1020" y1="330" x2="1020" y2="342" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#ar0)"/>
<rect x="60" y="350" width="340" height="200" rx="18" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.85" filter="url(#drop)"/>
<rect x="60" y="350" width="340" height="5" rx="2.5" fill="#8B5CF6"/>
<text x="82" y="390" font-size="22" font-weight="800" fill="#A78BFA" text-anchor="start" >Revision / correction</text>
<text x="82" y="416" font-size="13.5" font-weight="500" fill="#CBD5E1" text-anchor="start" >Corrects a recorded transaction</text>
<circle cx="90" cy="472" r="3.5" fill="#8B5CF6"/>
<text x="104" y="477" font-size="13.5" font-weight="500" fill="#F8FAFC" text-anchor="start" >Recorded in revision history</text>
<circle cx="90" cy="502" r="3.5" fill="#8B5CF6"/>
<text x="104" y="507" font-size="13.5" font-weight="500" fill="#F8FAFC" text-anchor="start" >Can affect payment allocation and stock</text>
<rect x="430" y="350" width="340" height="200" rx="18" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-opacity="0.85" filter="url(#drop)"/>
<rect x="430" y="350" width="340" height="5" rx="2.5" fill="#F59E0B"/>
<text x="452" y="390" font-size="22" font-weight="800" fill="#FBBF24" text-anchor="start" >Cancellation</text>
<text x="452" y="416" font-size="13.5" font-weight="500" fill="#CBD5E1" text-anchor="start" >Reverses / cancels the transaction</text>
<text x="452" y="435" font-size="13.5" font-weight="500" fill="#CBD5E1" text-anchor="start" >under applicable business rules</text>
<circle cx="460" cy="472" r="3.5" fill="#F59E0B"/>
<text x="474" y="477" font-size="13.5" font-weight="500" fill="#F8FAFC" text-anchor="start" >A cancellation of the transaction itself</text>
<circle cx="460" cy="502" r="3.5" fill="#F59E0B"/>
<text x="474" y="507" font-size="13.5" font-weight="500" fill="#F8FAFC" text-anchor="start" >Not the same operation as a refund</text>
<rect x="800" y="350" width="340" height="200" rx="18" fill="#EF4444" fill-opacity="0.12" stroke="#EF4444" stroke-opacity="0.85" filter="url(#drop)"/>
<rect x="800" y="350" width="340" height="5" rx="2.5" fill="#EF4444"/>
<text x="822" y="390" font-size="22" font-weight="800" fill="#F87171" text-anchor="start" >Refund</text>
<text x="822" y="416" font-size="13.5" font-weight="500" fill="#CBD5E1" text-anchor="start" >Applies when money / COGS has already</text>
<text x="822" y="435" font-size="13.5" font-weight="500" fill="#CBD5E1" text-anchor="start" >been recorded</text>
<circle cx="830" cy="472" r="3.5" fill="#EF4444"/>
<text x="844" y="477" font-size="13.5" font-weight="500" fill="#F8FAFC" text-anchor="start" >A separate operation from cancellation</text>
<circle cx="830" cy="502" r="3.5" fill="#EF4444"/>
<text x="844" y="507" font-size="13.5" font-weight="500" fill="#F8FAFC" text-anchor="start" >Effects flow into reports and exports</text>
<rect x="737" y="516" width="96" height="26" rx="13" fill="#111827" fill-opacity="0.95" stroke="#EC4899" stroke-opacity="0.85" />
<text x="785" y="533" font-size="11" font-weight="800" fill="#F9A8D4" text-anchor="middle" letter-spacing="0.5">NOT THE SAME</text>
<path d="M230 552 L230 584 M600 552 L600 584 M1020 552 L1020 584 M160 584 L1040 584" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="6 5"/>
<line x1="160" y1="584" x2="160" y2="642" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar0)"/>
<line x1="380" y1="584" x2="380" y2="642" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar0)"/>
<line x1="600" y1="584" x2="600" y2="642" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar0)"/>
<line x1="820" y1="584" x2="820" y2="642" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar0)"/>
<line x1="1040" y1="584" x2="1040" y2="642" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar0)"/>
<rect x="52" y="612" width="196" height="24" rx="8" fill="#111827"/>
<text x="60" y="628" font-size="12" font-weight="800" fill="#94A3B8" text-anchor="start" letter-spacing="2">DOWNSTREAM EFFECTS</text>
<rect x="60" y="644" width="200" height="78" rx="14" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-opacity="0.85" filter="url(#drop)"/>
<rect x="60" y="644" width="200" height="4" rx="2" fill="#10B981"/>
<text x="160" y="680" font-size="17" font-weight="700" fill="#F8FAFC" text-anchor="middle" >Payment</text>
<text x="160" y="703" font-size="17" font-weight="700" fill="#F8FAFC" text-anchor="middle" >allocation</text>
<rect x="280" y="644" width="200" height="78" rx="14" fill="#F59E0B" fill-opacity="0.14" stroke="#F59E0B" stroke-opacity="0.85" filter="url(#drop)"/>
<rect x="280" y="644" width="200" height="4" rx="2" fill="#F59E0B"/>
<text x="380" y="680" font-size="17" font-weight="700" fill="#F8FAFC" text-anchor="middle" >Inventory</text>
<text x="380" y="703" font-size="17" font-weight="700" fill="#F8FAFC" text-anchor="middle" >movements</text>
<rect x="500" y="644" width="200" height="78" rx="14" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.85" filter="url(#drop)"/>
<rect x="500" y="644" width="200" height="4" rx="2" fill="#8B5CF6"/>
<text x="600" y="691" font-size="17" font-weight="700" fill="#F8FAFC" text-anchor="middle" >Revision history</text>
<rect x="720" y="644" width="200" height="78" rx="14" fill="#EC4899" fill-opacity="0.14" stroke="#EC4899" stroke-opacity="0.85" filter="url(#drop)"/>
<rect x="720" y="644" width="200" height="4" rx="2" fill="#EC4899"/>
<text x="820" y="691" font-size="17" font-weight="700" fill="#F8FAFC" text-anchor="middle" >Audit trail</text>
<rect x="940" y="644" width="200" height="78" rx="14" fill="#06B6D4" fill-opacity="0.14" stroke="#06B6D4" stroke-opacity="0.85" filter="url(#drop)"/>
<rect x="940" y="644" width="200" height="4" rx="2" fill="#06B6D4"/>
<text x="1040" y="680" font-size="17" font-weight="700" fill="#F8FAFC" text-anchor="middle" >Reporting</text>
<text x="1040" y="703" font-size="17" font-weight="700" fill="#F8FAFC" text-anchor="middle" >/ exports</text>
<rect x="60" y="756" width="1080" height="96" rx="16" fill="#334155" fill-opacity="0.22" stroke="#334155" stroke-opacity="0.85" />
<text x="84" y="788" font-size="17" font-weight="800" fill="#F8FAFC" text-anchor="start" >Cancellation and refund are different operations.</text>
<text x="84" y="814" font-size="14" font-weight="500" fill="#CBD5E1" text-anchor="start" >Cancellation reverses / cancels the transaction under applicable business rules.</text>
<text x="84" y="836" font-size="14" font-weight="500" fill="#CBD5E1" text-anchor="start" >Refund applies when money / COGS has already been recorded.</text>

</svg>
