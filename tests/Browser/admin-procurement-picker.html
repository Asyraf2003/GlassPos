<!doctype html>
<meta charset="utf-8">
<style>.d-none { display: none; }</style>
<form>
<input id="nomor_faktur" value="TEST" data-procurement-header-field>
<input id="nama_pt_pengirim" value="Supplier">
<input id="tanggal_pengiriman"><input id="tanggal_terima">
<input type="radio" name="auto_receive" value="1" checked>
<input type="radio" name="auto_receive" value="0">
<input id="tax_input" data-tax-header-input>
<input type="hidden" data-tax-rounding-residue-confirmed-input value="0">
<div><input data-procurement-product-search aria-expanded="false"><div data-procurement-product-results></div></div>
<button type="button" id="procurement-start-new">Reset</button>
<div id="procurement-line-items" data-next-index="1"></div>

<template id="procurement-line-template">
<article data-line-item>
 <input type="hidden" data-previous-line-id>
 <input type="hidden" name="lines[__INDEX__][line_no]" data-line-no value="__LINE_NO__">
 <input type="hidden" name="lines[__INDEX__][product_id]" data-product-id>

 <div data-product-selected class="d-none"><strong data-selected-product-label></strong><button type="button" data-product-remove>×</button></div>
 <input name="lines[__INDEX__][qty_pcs]" data-qty-input value="1">
 <input type="hidden" name="lines[__INDEX__][line_total_rupiah]" data-money-raw>
 <input data-money-display>
 <div data-tax-line-group><input name="lines[__INDEX__][tax_input]" data-tax-line-input></div>
 <button type="button" data-remove-line>Remove row</button>
</article>
</template>
</form>
<script src="../../public/assets/static/js/shared/product-display.js"></script>
<script src="../../public/assets/static/js/shared/procurement-product-search.js"></script>
<script>
(async () => {
try {
  const params = new URLSearchParams(location.search);
  const mode = params.get("mode") === "edit" ? "edit" : "create";
  const hydration = params.get("hydration") || "draft";
  const key = mode === "create" ? "admin.procurement.create-supplier-invoice.draft.v2" : "glasspos.picker.fixture.edit";
  const form = document.querySelector("form");
  form.setAttribute("data-procurement-" + mode + "-form", "1");
  form.dataset.procurementDraftKey = key;
  const container = document.getElementById("procurement-line-items");
  container.innerHTML = document.getElementById("procurement-line-template").innerHTML.replaceAll("__INDEX__", "0").replaceAll("__LINE_NO__", "1");
  const initial = container.firstElementChild;
  initial.querySelector("[data-product-id]").value = "server";
  initial.querySelector("[data-selected-product-label]").textContent = "Server Product";
  initial.querySelector("[data-qty-input]").value = "2";
  initial.querySelector("[data-money-raw]").value = "20000";
  const draft = { header: { nomor_faktur: "TEST", auto_receive: "1" }, lines: [{
    product_id: "draft", product_label: "Draft Product", previous_line_id: "line-previous",
    qty_pcs: "2", line_total_rupiah: "20000", tax_input: "10%"
  }] };
  if (params.has("reloaded")) {
    if (localStorage.getItem(key)) throw new Error("discarded draft returned after reload");
  } else localStorage.setItem(key, JSON.stringify(draft));
  if (hydration === "server") localStorage.removeItem(key);
  window.requestAnimationFrame = (callback) => callback();
  window.procurementCreateConfig = { lookupEndpoint: "https://example.test/lookup", hasOldInput: hydration === "old" };
  const product = (id) => ({ id, label: `${id} Product`, nama_barang: `${id} Product`, kode_barang: id.toUpperCase(), merek: "NPP", ukuran: 0, available_stock: 10, default_unit_price_rupiah: 170000 });
  window.fetch = async (url) => {
    const params = new URL(url).searchParams;
    const rows = params.has("ids[]") ? params.getAll("ids[]").map(product) : [product(params.get("q"))];
    return { ok: true, json: async () => ({ success: true, data: { rows } }) };
  };
  const script = document.createElement("script");
  script.src = "../../public/assets/static/js/pages/admin-procurement-" + mode + ".js";
  await new Promise((resolve, reject) => { script.onload = resolve; script.onerror = reject; document.body.append(script); });
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const wait = () => new Promise((resolve) => setTimeout(resolve, 350));
  const rows = () => [...container.querySelectorAll("[data-line-item]")];
  const expectedId = hydration === "draft" ? "draft" : "server";
  await wait();
  const selected = rows().find((row) => row.querySelector("[data-product-id]").value === expectedId);
  assert(selected, "hydration identity / old-input precedence");
  const q = (selector) => selected.querySelector(selector);
  const search = document.querySelector("[data-procurement-product-search]");
  assert(document.querySelectorAll("[data-procurement-product-search]").length === 1 && !container.querySelector("[data-product-search]"), "one global search only");
  assert(search.compareDocumentPosition(container) & Node.DOCUMENT_POSITION_FOLLOWING, "search above blocks");
  assert(search.value === "", "hydration query empty");
  assert(q("[data-selected-product-label]").textContent.includes("NPP | 0 | sisa: 10 stok"), "hydration current metadata");
  assert(q("[data-selected-product-price]").textContent === "Harga jual Rp170.000 / pcs", "selling price secondary");
  if (params.has("reloaded")) {
    assert(q("[data-product-id]").value === "server" && q("[data-money-raw]").value === "20000", "reload restores persisted state");
    document.body.dataset.testResult = "PASS edit reload"; return;
  }
  q("[data-qty-input]").dispatchEvent(new Event("input", { bubbles: true })); await wait();
  const saved = JSON.parse(localStorage.getItem(key)).lines.find((line) => line.product_id === expectedId);
  assert(saved.qty_pcs === "2" && saved.line_total_rupiah === "20000", "draft purchase fields retained");
  if (hydration === "draft") assert(saved.tax_input === "10%", "draft retains line tax");
  if (mode === "edit" && hydration === "draft") assert(saved.previous_line_id === "line-previous", "edit previous ID");
  const choose = async (value) => { search.value = value; search.dispatchEvent(new Event("input", { bubbles: true })); await wait(); search.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowDown" })); search.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter" })); };
  await choose("new");
  assert(rows().map((row) => row.querySelector("[data-product-id]").value).join(",") === `${expectedId},new`, "global selection appends in order");
  const added = rows()[1];
  assert(document.activeElement === added.querySelector("[data-qty-input]"), "qty focus");
  added.querySelector('[data-qty-step="1"]').click();
  assert(added.querySelector("[data-qty-input]").value === "2", "quantity plus");
  added.querySelector('[data-qty-step="-1"]').click();
  assert(added.querySelector("[data-qty-input]").value === "1", "quantity minus");
  await choose("new");
  assert(rows().length === 2 && document.querySelector("[data-procurement-product-results]").textContent.includes("sudah dipakai"), "duplicate rejected");
  await choose("other");
  assert(rows().length === 3 && rows()[2].querySelector("[data-product-id]").value === "other", "later selections append downward");
  added.querySelector("[data-remove-line]").click();
  assert(document.activeElement === search && rows().map((row) => row.querySelector("[data-line-no]").value).join(",") === "1,2", "remove focuses global and reindexes");
  search.value = "pending"; search.dispatchEvent(new Event("input")); search.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" })); await wait();
  assert(document.querySelector("[data-procurement-product-results]").classList.contains("d-none"), "escape cancels request");
  q("[data-qty-input]").dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", ctrlKey: true, cancelable: true }));
  assert(document.activeElement === search && rows().length === 2, "Ctrl Enter focuses global without blank block");
  const receiving = document.querySelector('input[name="auto_receive"][value="0"]');
  receiving.checked = true;
  receiving.dispatchEvent(new Event("change", { bubbles: true }));
  assert(document.getElementById("tanggal_terima").disabled, "receiving state");
  await wait();
  assert(JSON.parse(localStorage.getItem(key)).header.auto_receive === "0", "receiving draft retained");
  window.confirm = () => false;
  document.getElementById("procurement-start-new").click();
  assert(rows().length === 2 && localStorage.getItem(key), "reset cancellation preserves draft");
  if (mode === "create") {
    window.confirm = () => true;
    document.getElementById("procurement-start-new").click();
    await wait();
    assert(!localStorage.getItem(key) && rows().length === 0 && document.getElementById("nomor_faktur").value === "", "start new clears meaningful state and draft");
  }
  if (mode === "edit") {
    const reload = new URL(location.href); reload.searchParams.set("hydration", "server"); reload.searchParams.set("reloaded", "1");
    window.procurementCreateConfig.reloadUrl = reload.href;
    window.confirm = () => true;
    document.getElementById("procurement-start-new").click(); return;
  }
  localStorage.removeItem(key);
  document.body.dataset.testResult = "PASS " + mode + " " + hydration;
} catch (error) { document.body.dataset.testResult = "FAIL: " + error.message; }
})();
</script>
